# Movie Mode Automation
# Dims lights, sets TV backlight, closes blinds
automation:
  - alias: "Movie Mode On"
    description: "Cinema experience — dim lights, purple backlight, close blinds"
    trigger:
      - platform: state
        entity_id: input_boolean.movie_mode
        to: "on"
      - platform: state
        entity_id: media_player.living_room_tv  # TODO: replace
        to: "playing"
        for: "00:00:05"
    action:
      - service: light.turn_on
        target:
          entity_id: light.living_room  # TODO: replace
        data:
          brightness_pct: 5
          transition: 3
      - service: light.turn_on
        target:
          entity_id: light.tv_backlight  # TODO: replace
        data:
          rgb_color: [180, 74, 255]
          brightness_pct: 40
      - service: cover.close_cover
        target:
          entity_id: cover.living_room_blinds  # TODO: replace
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.movie_mode

  - alias: "Movie Mode Off"
    description: "Restore lights when movie mode toggled off or media idle"
    trigger:
      - platform: state
        entity_id: input_boolean.movie_mode
        to: "off"
      - platform: state
        entity_id: media_player.living_room_tv  # TODO: replace
        to: "idle"
        for: "00:00:30"
    action:
      - service: light.turn_on
        target:
          entity_id: light.living_room  # TODO: replace
        data:
          brightness_pct: 80
          color_temp_kelvin: 3000
          transition: 3
      - service: light.turn_off
        target:
          entity_id: light.tv_backlight  # TODO: replace
      - service: cover.open_cover
        target:
          entity_id: cover.living_room_blinds  # TODO: replace
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.movie_mode
